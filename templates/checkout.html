{% extends "base.html" %}

{% block title %}
Checkout
{% endblock %}

{% block content %}

<h1>Checkout</h1>

<form method="POST">

    <h2>Shipping Information</h2>

    <div>
        <label for="name">
            Full Name
        </label>

        <input
            type="text"
            id="name"
            name="name"
            required
        >
    </div>

    <div>
        <label for="address">
            Shipping Address
        </label>

        <input
            type="text"
            id="address"
            name="address"
            required
        >
    </div>

    <h2>Payment Information</h2>

    <div>
        <label for="card">
            Card Number
        </label>

        <input
            type="text"
            id="card"
            name="card"
            required
        >
    </div>

    <div>
        <label for="expiration">
            Expiration Date
        </label>

        <input
            type="text"
            id="expiration"
            name="expiration"
            placeholder="MM/YY"
            required
        >
    </div>

    <div>
        <label for="cvv">
            CVV
        </label>

        <input
            type="text"
            id="cvv"
            name="cvv"
            required
        >
    </div>

    <h2>Order Summary</h2>

    <p>
        Subtotal: $19.99
    </p>

    <p>
        Total: $19.99
    </p>

    <button type="submit">
        Place Order
    </button>

</form>

{% endblock %}
